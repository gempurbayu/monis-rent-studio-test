<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>optimized glb grid</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        background: #f8f3ea;
        font: 12px system-ui;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }
      figure {
        margin: 0;
        padding: 4px;
      }
      model-viewer {
        width: 100%;
        height: 200px;
        background: #f8f3ea;
      }
      figcaption {
        text-align: center;
        color: #17322c;
      }
    </style>
  </head>
  <body>
    <script type="module">
      const ids = [
        "desk-electric",
        "desk-mechanical",
        "chair-ergonomic",
        "mon-24-fhd",
        "mon-27-4k",
        "mon-34-curved",
        "kb-mx-keys",
        "mouse-mx-master",
        "lamp-desk",
        "nespresso",
      ];
      document.body.innerHTML = ids
        .map(
          (id) => `<figure>
        <model-viewer src="/models/${id}.glb" camera-orbit="35deg 72deg auto"
          shadow-intensity="1" exposure="1.15" disable-zoom
          environment-image="neutral"></model-viewer>
        <figcaption>${id}</figcaption></figure>`,
        )
        .join("");
    </script>
  </body>
</html>
